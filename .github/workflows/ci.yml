name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Offline tests
        run: npm test
      - name: Doctor (which free data sources this runner can reach)
        run: npm run doctor
      - name: Smoke test (real server, real data)
        run: npm run smoke

  # The optional Mac app (macos/) still compiles, gets its icon and signs, on a clean Mac.
  mac-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Quant Terminal.app
        run: macos/build.sh "$RUNNER_TEMP/app"
      - name: Check the bundle
        run: |
          app="$RUNNER_TEMP/app/Quant Terminal.app"
          codesign --verify "$app"
          test -s "$app/Contents/Resources/AppIcon.icns"
          plutil -extract QTInstallDir raw "$app/Contents/Info.plist"

  # Runs the setup prompt's own commands (INSTALL-PROMPT.md) in every shell it names, without an
  # AI agent, from a downloaded archive (no git). Each download runs twice, the second time over
  # a saved data folder, the way an update does. The prompt fetches refs/heads/main; CI fetches
  # the commit under test with the same commands.
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, shell: powershell }
          - { os: windows-latest, shell: cmd }
          - { os: windows-latest, shell: bash }
          - { os: macos-latest, shell: bash }
          - { os: ubuntu-latest, shell: bash }
    runs-on: ${{ matrix.os }}
    env:
      QT_NO_OPEN: "1"
      TARBALL: https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz
      ZIPBALL: https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and unpack (Windows PowerShell 5, as in the prompt)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          Set-Location $env:USERPROFILE
          New-Item -ItemType Directory -Force quant-terminal | Out-Null
          Remove-Item "$env:TEMP\quant-terminal.zip" -ErrorAction SilentlyContinue
          curl.exe -fsSL -o "$env:TEMP\quant-terminal.zip" $env:ZIPBALL
          if ($LASTEXITCODE -eq 0) { & "$env:SystemRoot\System32\tar.exe" -xf "$env:TEMP\quant-terminal.zip" --strip-components=1 -C quant-terminal; Remove-Item "$env:TEMP\quant-terminal.zip" }
          if (-not (Test-Path quant-terminal\server.js)) { exit 1 }
          New-Item -ItemType Directory -Force quant-terminal\data | Out-Null
          Set-Content quant-terminal\data\keep.txt saved
          New-Item -ItemType Directory -Force quant-terminal | Out-Null
          Remove-Item "$env:TEMP\quant-terminal.zip" -ErrorAction SilentlyContinue
          curl.exe -fsSL -o "$env:TEMP\quant-terminal.zip" $env:ZIPBALL
          if ($LASTEXITCODE -eq 0) { & "$env:SystemRoot\System32\tar.exe" -xf "$env:TEMP\quant-terminal.zip" --strip-components=1 -C quant-terminal; Remove-Item "$env:TEMP\quant-terminal.zip" }
          if (-not (Test-Path quant-terminal\data\keep.txt)) { exit 1 }
          if (Test-Path "$env:TEMP\quant-terminal.zip") { exit 1 }
          Remove-Item -Recurse quant-terminal\data
      - name: Download and unpack (Windows cmd, as in the prompt)
        if: matrix.shell == 'cmd'
        shell: cmd
        run: |
          cd /d %USERPROFILE%
          if not exist quant-terminal mkdir quant-terminal
          del "%TEMP%\quant-terminal.zip" 2>nul
          curl.exe -fsSL -o "%TEMP%\quant-terminal.zip" %ZIPBALL% && "%SystemRoot%\System32\tar.exe" -xf "%TEMP%\quant-terminal.zip" --strip-components=1 -C quant-terminal && del "%TEMP%\quant-terminal.zip"
          if not exist quant-terminal\server.js exit /b 1
          mkdir quant-terminal\data
          echo saved> quant-terminal\data\keep.txt
          if not exist quant-terminal mkdir quant-terminal
          del "%TEMP%\quant-terminal.zip" 2>nul
          curl.exe -fsSL -o "%TEMP%\quant-terminal.zip" %ZIPBALL% && "%SystemRoot%\System32\tar.exe" -xf "%TEMP%\quant-terminal.zip" --strip-components=1 -C quant-terminal && del "%TEMP%\quant-terminal.zip"
          if not exist quant-terminal\data\keep.txt exit /b 1
          if exist "%TEMP%\quant-terminal.zip" exit /b 1
          rmdir /s /q quant-terminal\data
      - name: Download and unpack (macOS, Linux, Git Bash, as in the prompt)
        if: matrix.shell == 'bash'
        shell: bash
        run: |
          cd ~
          mkdir -p quant-terminal && curl -fsSL -o quant-terminal.tar.gz "$TARBALL" && tar -xzf quant-terminal.tar.gz --strip-components=1 -C quant-terminal && rm quant-terminal.tar.gz
          test -f quant-terminal/server.js
          mkdir -p quant-terminal/data && echo saved > quant-terminal/data/keep.txt
          mkdir -p quant-terminal && curl -fsSL -o quant-terminal.tar.gz "$TARBALL" && tar -xzf quant-terminal.tar.gz --strip-components=1 -C quant-terminal && rm quant-terminal.tar.gz
          test -f quant-terminal/data/keep.txt
          rm -rf quant-terminal/data
      - name: Check, set up, launch, stop (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Set-Location "$env:USERPROFILE\quant-terminal"
          node scripts/check.js; if ($LASTEXITCODE -ne 0) { exit 1 }
          node scripts/setup.js --watchlist "BTCUSDT, ETHUSDT, SOLUSDT, SPY, QQQ, NVDA, AAPL, EURUSD" --symbol BTCUSDT --tf 1D
          node scripts/launch.js; if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Sleep -Seconds 2
          (Invoke-WebRequest -Uri http://127.0.0.1:3777/api/health -UseBasicParsing).Content
          node scripts/stop.js
      - name: Check, set up, launch, stop (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd ~/quant-terminal
          node scripts/check.js
          node scripts/setup.js --watchlist "BTCUSDT, ETHUSDT, SOLUSDT, SPY, QQQ, NVDA, AAPL, EURUSD" --symbol BTCUSDT --tf 1D
          node scripts/launch.js
          sleep 2
          curl -fsS http://127.0.0.1:3777/api/health
          node scripts/stop.js
